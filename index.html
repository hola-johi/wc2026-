<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Predicho — Predictor del Mundial 2026"/>
  <title>🐐 Predicho · WC2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/wc2026-/manifest.json"/>

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Predicho"/>
  <link rel="apple-touch-icon" href="/wc2026-/assets/icono/icon-home-180.png"/>
  <link rel="apple-touch-icon-precomposed" href="/wc2026-/assets/icono/icon-home-180.png"/>
  <link rel="apple-touch-icon" sizes="192x192" href="/wc2026-/assets/icono/icon-home-192-ios.png"/>

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="/wc2026-/assets/icono/icon-home-192.png"/>
  <link rel="shortcut icon" href="/wc2026-/assets/icono/icon-home-192.png"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:    #EEF3FF; --nav:  #1A3A8F; --nav2: #152F75;
      --card:  #FFFFFF; --cel:  #74ACDF; --cel-lt: #D6EAFF;
      --bdr:   rgba(26,58,143,0.13);
      --shd:   0 3px 14px rgba(26,58,143,0.10);
      --grn:   #059669; --amb: #D97706; --red: #DC2626;
      --txt:   #0F172A; --sec: #475569; --trt: #94A3B8;
    }
    body { background:var(--bg); color:var(--txt); font-family:'Inter',-apple-system,sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; }

    /* HEADER */
    header { background:var(--nav); padding:13px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; overflow:hidden; }
    header::before { content:""; position:absolute; top:0; left:0; width:90px; height:90px; pointer-events:none;
      background:repeating-linear-gradient(135deg,rgba(116,172,223,0) 0,rgba(116,172,223,0) 10px,rgba(116,172,223,.22) 10px,rgba(116,172,223,.22) 16px,rgba(255,255,255,.12) 16px,rgba(255,255,255,.12) 20px,rgba(116,172,223,.22) 20px,rgba(116,172,223,.22) 26px,rgba(116,172,223,0) 26px,rgba(116,172,223,0) 36px); }
    .logo { display:flex; align-items:center; gap:10px; z-index:1; }
    .logo-icon { font-size:22px; width:36px; height:36px; background:rgba(255,255,255,.15); border-radius:10px; display:flex; align-items:center; justify-content:center; }
    .logo-title { font-size:18px; font-weight:900; color:#fff; letter-spacing:-.5px; }
    .logo-sub   { font-size:9px; color:var(--cel); font-family:monospace; letter-spacing:1.5px; margin-top:1px; }
    .pill { font-size:10px; font-family:monospace; color:#fff; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.12); padding:5px 11px; border-radius:20px; z-index:1; }

    /* TABS */
    .tabs-main { background:var(--nav2); display:flex; position:sticky; top:56px; z-index:90; }
    .tab-main { flex:1; padding:13px 0; background:none; border:none; border-bottom:3px solid transparent; cursor:pointer; font-size:13px; font-weight:700; color:rgba(255,255,255,.5); transition:all .15s; font-family:'Inter',sans-serif; }
    .tab-main.on { color:#fff; border-bottom-color:var(--cel); }

    /* ROUND TABS */
    .tabs-round { background:var(--card); border-bottom:1px solid var(--bdr); display:flex; overflow-x:auto; scrollbar-width:none; position:sticky; top:99px; z-index:80; box-shadow:0 2px 8px rgba(26,58,143,.07); }
    .tabs-round::-webkit-scrollbar { display:none; }
    .tab-round { flex:0 0 auto; padding:10px 13px; background:none; border:none; border-bottom:2px solid transparent; cursor:pointer; font-size:11px; font-weight:700; color:var(--trt); white-space:nowrap; transition:all .15s; font-family:'Inter',sans-serif; }
    .tab-round.on { color:var(--nav); border-bottom-color:var(--nav); }

    main { max-width:480px; margin:0 auto; padding:14px 12px 60px; }
    .sec { display:none; } .sec.on { display:block; }
    #loading { text-align:center; padding:60px 20px; color:var(--trt); font-family:monospace; }
    .d{animation:blink 1.4s infinite;display:inline-block} .d:nth-child(2){animation-delay:.2s} .d:nth-child(3){animation-delay:.4s}
    @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

    /* PODIUM */
    .podium { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px; }
    .pod { background:var(--card); border-radius:16px; box-shadow:var(--shd); overflow:hidden; text-align:center; }
    .pod-stripe { height:5px; }
    .pod.gold .pod-stripe   { background:linear-gradient(90deg,#B45309,#F59E0B); }
    .pod.silver .pod-stripe { background:linear-gradient(90deg,#64748B,#94A3B8); }
    .pod.bronze .pod-stripe { background:linear-gradient(90deg,#92400E,#B45309); }
    .pod-inner { padding:10px 8px 12px; }
    .pod-medal { font-size:20px; margin-bottom:4px; }
    .pod-flag  { font-size:34px; display:block; margin-bottom:3px; }
    .pod-name  { font-size:12px; font-weight:800; color:var(--nav); margin-bottom:3px; }
    .pod-pct   { font-size:18px; font-family:monospace; font-weight:900; color:var(--nav); }
    .pod-lbl   { font-size:8px; color:#64748B; font-family:monospace; letter-spacing:1px; }

    /* SECTION TITLE */
    .stitle { font-size:10px; font-weight:700; letter-spacing:2px; color:var(--nav); font-family:monospace; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
    .stitle::before, .stitle::after { content:""; flex:1; height:1px; background:var(--bdr); }

    /* NEXT MATCH */
    .nm { background:var(--card); border-radius:16px; box-shadow:var(--shd); overflow:hidden; margin-bottom:18px; }
    .nm-top { background:var(--nav); padding:8px 14px; display:flex; justify-content:space-between; align-items:center; }
    .nm-label { font-size:10px; font-weight:700; color:var(--cel); letter-spacing:1.5px; }
    .nm-sub   { font-size:9px; color:rgba(255,255,255,.6); font-family:monospace; }
    .nm-body  { padding:14px 12px; display:flex; align-items:center; }
    .nm-team  { flex:1; text-align:center; }
    .nm-team .fl { font-size:38px; display:block; margin-bottom:4px; }
    .nm-team .ab { font-size:15px; font-weight:800; color:var(--nav); }
    .nm-team .nm2{ font-size:10px; color:var(--sec); margin-top:2px; }
    .nm-ctr   { text-align:center; flex:0 0 86px; }
    .nm-score { font-size:30px; font-family:monospace; font-weight:900; color:var(--nav); display:block; }
    .nm-slbl  { font-size:8px; color:var(--trt); font-family:monospace; letter-spacing:1px; margin-top:2px; display:block; }

    /* RANKINGS */
    .ranks { display:flex; flex-direction:column; gap:6px; margin-bottom:18px; }
    .rr { background:var(--card); border-radius:12px; box-shadow:0 2px 8px rgba(26,58,143,.07); padding:10px 12px; display:flex; align-items:center; gap:9px; }
    .rk-n { font-size:10px; font-weight:800; color:var(--trt); min-width:18px; font-family:monospace; }
    .rk-n.t3 { color:var(--nav); }
    .rk-fl { font-size:18px; }
    .rk-nm { flex:1; font-size:13px; font-weight:700; }
    .rk-tr { font-size:12px; font-weight:800; font-family:monospace; }
    .rk-tr.up{color:var(--grn)} .rk-tr.dn{color:var(--red)} .rk-tr.fl{color:var(--trt)}
    .rk-s  { display:flex; gap:10px; }
    .rk-st { text-align:right; }
    .rk-v  { font-size:13px; font-family:monospace; font-weight:800; }
    .rk-v.ch{color:var(--nav)} .rk-v.sc{color:var(--sec)} .rk-v.tr{color:var(--trt)}
    .rk-l  { font-size:8px; color:#64748B; font-family:monospace; letter-spacing:1px; display:block; }
    .bb { height:3px; width:50px; background:var(--bdr); border-radius:2px; overflow:hidden; margin-top:2px; }
    .bf { height:100%; background:var(--cel); border-radius:2px; }

    /* ══════════════════════════════════════════
       FIXTURE CARD — prode format
       Claro quién GANA / PIERDE / EMPATA
    ══════════════════════════════════════════ */
    .day-header {
      font-size:13px; font-weight:800; color:var(--nav);
      padding:16px 0 8px; letter-spacing:-.2px;
      display:flex; align-items:center; gap:8px;
    }
    .day-header::after { content:""; flex:1; height:1px; background:var(--bdr); }

    .fc {
      background:var(--card); border-radius:14px;
      box-shadow:var(--shd); margin-bottom:10px;
      overflow:hidden; animation:up .2s ease both;
      border:1.5px solid var(--bdr);
    }
    /* Top bar: grupo + hora + sede */
    .fc-top {
      background:var(--nav); padding:6px 12px;
      display:flex; align-items:center; gap:8px;
    }
    .fc-grp {
      font-size:9px; font-weight:800; color:var(--cel);
      font-family:monospace; letter-spacing:1.5px;
      background:rgba(255,255,255,.1); padding:2px 7px; border-radius:4px;
    }
    .fc-time { font-size:9px; color:rgba(255,255,255,.7); font-family:monospace; font-weight:600; }
    .fc-venue { font-size:9px; color:rgba(255,255,255,.72); font-family:monospace; margin-left:auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:140px; }

    /* Cuerpo figurita */
    .fc-body {
      background:linear-gradient(155deg,#D6EAFF 0%,#B8D6F5 60%,#A0C8F0 100%);
      padding:10px 10px 8px; position:relative; overflow:hidden;
    }
    .fc-body::after {
      content:"2026"; position:absolute; bottom:-8px; right:-4px;
      font-size:64px; font-weight:900; color:rgba(26,58,143,.07);
      pointer-events:none; letter-spacing:-4px; line-height:1;
    }

    /* Row equipos */
    .fc-row { display:flex; align-items:center; gap:6px; position:relative; z-index:1; }

    /* Equipo izquierdo */
    .fc-t1 { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; }
    .fc-t2 { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; }
    .fc-t1.loser, .fc-t2.loser { opacity:.38; }

    .fc-fl  { font-size:34px; line-height:1; }
    .fc-ab  { font-size:12px; font-weight:800; color:var(--nav); }
    .fc-nm2 { font-size:9px; color:#334155; font-weight:600; text-align:center; line-height:1.2; }

    /* Score central */
    .fc-sc-box { text-align:center; min-width:82px; display:flex; flex-direction:column; align-items:center; gap:2px; }
    .fc-sc {
      font-size:26px; font-family:monospace; font-weight:900; letter-spacing:-1px;
      color:var(--nav); background:rgba(255,255,255,.72);
      border:1.5px solid rgba(26,58,143,.18); border-radius:10px;
      padding:4px 10px; backdrop-filter:blur(4px);
    }
    .fc-sc-lbl { font-size:8px; color:var(--nav); font-family:monospace; letter-spacing:1px; font-weight:700; }

    /* Fila resultado — la clave del prode */
    .fc-result {
      display:flex; align-items:center; gap:6px;
      padding:6px 10px; margin-top:4px; position:relative; z-index:1;
    }
    .fc-r1, .fc-r2 { flex:1; text-align:center; }
    .fc-r-mid { min-width:82px; text-align:center; }

    .result-win {
      display:inline-flex; align-items:center; gap:4px;
      background:rgba(26,58,143,.1); border:1px solid rgba(26,58,143,.2);
      border-radius:20px; padding:3px 10px;
      font-size:10px; font-weight:800; color:var(--nav);
      font-family:monospace; letter-spacing:.5px;
    }
    .result-win .chk { color:var(--grn); font-size:12px; }
    .result-lose {
      font-size:9px; font-weight:700; color:#475569;
      font-family:monospace; letter-spacing:.5px;
    }
    .result-draw {
      display:inline-flex; align-items:center;
      background:rgba(215,119,6,.1); border:1px solid rgba(215,119,6,.2);
      border-radius:20px; padding:3px 10px;
      font-size:10px; font-weight:800; color:var(--amb);
      font-family:monospace; letter-spacing:.5px;
    }
    .fc-prob { font-size:9px; color:var(--nav); font-family:monospace; font-weight:700; }
    .fc-prob-l { font-size:9px; color:#64748B; font-family:monospace; font-weight:600; }

    /* ══════════════════════════════════════════
       KNOCKOUT CARD — figurita grande
    ══════════════════════════════════════════ */
    .kc {
      background:var(--card); border-radius:16px;
      box-shadow:0 4px 16px rgba(26,58,143,.14); margin-bottom:12px;
      overflow:hidden; animation:up .22s ease both;
      border:1.5px solid var(--bdr);
    }
    .kc-top { background:var(--nav); padding:7px 13px; display:flex; justify-content:space-between; align-items:center; }
    .kc-time { font-size:9px; color:rgba(255,255,255,.7); font-family:monospace; font-weight:600; }
    .kc-conf { font-size:8px; font-weight:700; font-family:monospace; letter-spacing:1px; padding:2px 8px; border-radius:12px; }
    .kc-conf.Alta  { color:var(--grn); background:rgba(5,150,105,.15); border:1px solid rgba(5,150,105,.2); }
    .kc-conf.Media { color:var(--amb); background:rgba(215,119,6,.12); border:1px solid rgba(215,119,6,.2); }
    .kc-conf.Baja  { color:rgba(255,255,255,.75); background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); }

    .kc-bg {
      background:linear-gradient(155deg,#D6EAFF 0%,#B8D6F5 60%,#A0C8F0 100%);
      padding:12px 12px 8px; position:relative; overflow:hidden;
    }
    .kc-bg::after { content:"2026"; position:absolute; bottom:-8px; right:-4px; font-size:68px; font-weight:900; color:rgba(26,58,143,.07); pointer-events:none; letter-spacing:-4px; line-height:1; }

    .kc-row { display:flex; align-items:center; gap:6px; position:relative; z-index:1; }
    .kc-team { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; transition:opacity .2s; }
    .kc-team.loser { opacity:.48; }
    .kc-fl { font-size:38px; line-height:1; }
    .kc-ab { font-size:13px; font-weight:800; color:var(--nav); }
    .kc-nm { font-size:10px; color:#334155; text-align:center; line-height:1.2; font-weight:600; }
    .kc-prob-w { font-size:9px; font-family:monospace; font-weight:700; color:var(--nav); }
    .kc-prob-l { font-size:9px; font-family:monospace; font-weight:700; color:#64748B; }

    .kc-sc-box { text-align:center; min-width:80px; display:flex; flex-direction:column; align-items:center; gap:3px; }
    .kc-sc { font-size:28px; font-family:monospace; font-weight:900; letter-spacing:-1px; color:var(--nav); background:rgba(255,255,255,.7); border:1.5px solid rgba(26,58,143,.2); border-radius:12px; padding:5px 12px; }
    .kc-sl { font-size:8px; color:var(--nav); font-family:monospace; letter-spacing:1px; font-weight:700; }

    /* Resultado knockout */
    .kc-result {
      display:flex; align-items:center; gap:6px;
      padding:5px 10px; position:relative; z-index:1;
    }
    .kc-r1, .kc-r2 { flex:1; text-align:center; }
    .kc-r-mid { min-width:80px; text-align:center; }

    /* FINAL */
    .final-card { border-radius:18px; overflow:hidden; box-shadow:0 6px 24px rgba(26,58,143,.2); border:2px solid rgba(26,58,143,.25); }
    .final-top { background:var(--nav); padding:10px 14px; display:flex; justify-content:space-between; align-items:center; }
    .final-top-title { font-size:10px; font-weight:800; color:var(--cel); letter-spacing:1.5px; font-family:monospace; }
    .final-bg { background:linear-gradient(155deg,#B8D6F5 0%,#8EC0F0 50%,#74ACDF 100%); padding:16px 14px 12px; position:relative; overflow:hidden; }
    .final-bg::after { content:"FINAL"; position:absolute; bottom:-8px; right:-6px; font-size:58px; font-weight:900; color:rgba(26,58,143,.08); pointer-events:none; letter-spacing:-2px; line-height:1; }
    .final-body { display:flex; align-items:center; gap:8px; position:relative; z-index:1; }
    .final-team { flex:1; text-align:center; }
    .final-team .fl { font-size:46px; display:block; margin-bottom:5px; }
    .final-team .nm { font-size:14px; font-weight:800; color:var(--nav); }
    .final-team.loser { opacity:.28; }
    .champ-badge { display:inline-block; margin-top:7px; font-size:9px; font-weight:700; color:#fff; background:var(--nav); padding:3px 12px; border-radius:20px; letter-spacing:1px; font-family:monospace; }
    .final-ctr { text-align:center; min-width:78px; }
    .final-sc { font-size:34px; font-family:monospace; font-weight:900; color:var(--nav); display:block; letter-spacing:-2px; background:rgba(255,255,255,.65); border-radius:13px; padding:5px 10px; }
    .final-sl { font-size:8px; font-family:monospace; color:var(--nav); letter-spacing:1px; font-weight:700; margin-top:3px; display:block; }
    .final-strip { background:var(--nav); padding:10px 14px; display:flex; justify-content:space-around; }
    .fst { text-align:center; }
    .fst-l { font-size:8px; color:var(--cel); font-family:monospace; letter-spacing:1px; }
    .fst-v { font-size:15px; font-family:monospace; font-weight:900; color:#fff; }

    /* JUGADORES */
    .ph-feat { background:var(--card); border-radius:14px; box-shadow:var(--shd); padding:13px 14px; display:flex; align-items:center; gap:12px; border-left:3px solid var(--cel); margin-bottom:8px; }
    .ph-feat .icon { font-size:24px; flex-shrink:0; }
    .ph-ft { font-size:13px; font-weight:700; color:var(--nav); margin-bottom:2px; }
    .ph-fs { font-size:11px; color:var(--sec); }

    /* FOOTER */
    .footer-card { margin-top:20px; padding:13px 14px; background:var(--card); border-radius:14px; box-shadow:var(--shd); border-top:3px solid var(--nav); }
    .footer-card h3 { font-size:12px; font-weight:700; color:var(--nav); margin-bottom:6px; }
    .footer-card code { display:block; font-size:10px; color:var(--nav); background:rgba(26,58,143,.05); padding:8px 10px; border-radius:8px; border:1px solid var(--bdr); word-break:break-all; margin-bottom:5px; font-family:monospace; }
    .footer-card p { font-size:10px; color:#64748B; }
    .update-info { font-size:10px; color:#64748B; font-family:monospace; text-align:center; margin-top:12px; }

    @media(max-width:400px) {
      .rk-l{display:none} .bb{display:none} .rk-v.tr{display:none}
      .fc-venue{display:none}
    }

    /* ACCURACY BADGES */
    .badge { display:inline-flex; align-items:center; font-size:9px; font-weight:700; font-family:monospace; letter-spacing:.5px; padding:3px 9px; border-radius:20px; color:#fff; white-space:nowrap; }
    .badge-exact   { background:#059669; }
    .badge-partial { background:#D97706; }
    .badge-wrong   { background:#DC2626; }
    .badge-pending { background:#94A3B8; }

    /* PREDICHOS TAB */
    .acc-card { background:var(--card); border-radius:16px; box-shadow:var(--shd); padding:16px 14px; margin-bottom:18px; border-top:3px solid var(--nav); }
    .acc-title { font-size:11px; font-weight:700; color:var(--nav); margin-bottom:12px; font-family:monospace; letter-spacing:1.5px; }
    .acc-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
    .acc-item { background:rgba(26,58,143,.05); border-radius:10px; padding:8px 10px; }
    .acc-num  { font-size:22px; font-weight:900; font-family:monospace; color:var(--nav); line-height:1; }
    .acc-lbl  { font-size:9px; color:var(--sec); font-family:monospace; letter-spacing:1px; margin-top:2px; }
    .acc-big  { text-align:center; padding:10px; background:rgba(5,150,105,.07); border-radius:10px; margin-top:8px; }
    .acc-big-v { font-size:26px; font-weight:900; font-family:monospace; color:#059669; }
    .acc-big-l { font-size:9px; color:#059669; font-family:monospace; letter-spacing:1px; }

    /* MATCH RESULT CARDS */
    .mr { background:var(--card); border-radius:14px; box-shadow:0 2px 8px rgba(26,58,143,.07); margin-bottom:8px; overflow:hidden; animation:up .2s ease both; border:1.5px solid var(--bdr); }
    .mr-top { background:var(--nav); padding:6px 12px; display:flex; justify-content:space-between; align-items:center; }
    .mr-meta { font-size:9px; color:rgba(255,255,255,.6); font-family:monospace; }
    .mr-body { background:linear-gradient(135deg,#D6EAFF,#B8D6F5); padding:10px 12px 8px; }
    .mr-row  { display:flex; align-items:center; gap:6px; }
    .mr-team { flex:1; text-align:center; }
    .mr-fl   { font-size:28px; line-height:1; display:block; margin-bottom:2px; }
    .mr-ab   { font-size:11px; font-weight:800; color:var(--nav); }
    .mr-ctr  { text-align:center; min-width:80px; }
    .mr-actual { font-size:24px; font-family:monospace; font-weight:900; color:var(--nav); background:rgba(255,255,255,.75); border:1.5px solid rgba(26,58,143,.2); border-radius:8px; padding:3px 8px; display:block; }

       INTRO ANIMATION
    ══════════════════════════════════════════ */

      position: fixed;

      background: #000;
      z-index: 1000;
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
    }

    .intro-stage {
      position: relative;
      /* sin min() con aritmética — compatible con todos los móviles */
      width: 72vw;
      max-width: 290px;
      /* ratio letras.png: 1296/2000 = 0.648 → height = width / 0.648 */
      height: calc(72vw / 0.648);
      max-height: min(448px, 72vh);
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
    }

    .intro-letras {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
      opacity: 0;
      -webkit-transform: scale(0.9);
      transform: scale(0.9);

      z-index: 1;
    }
    .intro-letras img { width: 100%; height: 100%; object-fit: contain; display: block; }

    .intro-copa {
      position: absolute;
      left: 50%; top: 44%;
      -webkit-transform: translate(-50%, -50%) scale(6);
      transform: translate(-50%, -50%) scale(6);
      width: 62%;
      z-index: 2;
      opacity: 0;
      -webkit-animation: copaZoom 1.1s cubic-bezier(0.16,1,0.3,1) 1.1s both;
      animation: copaZoom 1.1s cubic-bezier(0.16,1,0.3,1) 1.1s both;
    }
    .intro-copa img { width: 100%; display: block; }

    #intro.zoom-in {
      -webkit-animation: sceneZoom 1.1s cubic-bezier(0.25,0.1,0.25,1) forwards;
      animation: sceneZoom 1.1s cubic-bezier(0.25,0.1,0.25,1) forwards;
    }

    @-webkit-keyframes letrasIn {
      to { opacity: 1; -webkit-transform: scale(1); transform: scale(1); }
    }
    @keyframes letrasIn {
      to { opacity: 1; transform: scale(1); }
    }
    @-webkit-keyframes copaZoom {
      0%  { opacity: 0; -webkit-transform: translate(-50%,-50%) scale(6); transform: translate(-50%,-50%) scale(6); }
      12% { opacity: 1; }
      100%{ opacity: 1; -webkit-transform: translate(-50%,-50%) scale(1); transform: translate(-50%,-50%) scale(1); }
    }
    @keyframes copaZoom {
      0%  { opacity: 0; transform: translate(-50%, -50%) scale(6); }
      12% { opacity: 1; }
      100%{ opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    @-webkit-keyframes sceneZoom {
      0%   { -webkit-transform: scale(1);   opacity: 1; }
      100% { -webkit-transform: scale(1.5); opacity: 0; }
    }
    @keyframes sceneZoom {
      0%   { transform: scale(1);   opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    .fi { height:1em; width:auto; object-fit:contain; vertical-align:middle; display:inline-block; }

    @keyframes goalIn     { from{opacity:0;transform:scale(.88)} to{opacity:1;transform:scale(1)} }

    @keyframes initPulse  { 0%{transform:scale(1)} 45%{transform:scale(1.5)} 100%{transform:scale(1)} }
    @keyframes restSlide  { from{max-width:0;opacity:0} to{max-width:600px;opacity:1} }
  </style>
</head>

function resultRow(t1, s1, t2, s2, p, isDraw) {
  const p2 = 100 - p;
  if (isDraw) {
    return `
      <div class="fc-result">
        <div class="fc-r1"><span class="fc-prob">${p}%</span></div>
        <div class="fc-r-mid"><span class="result-draw">⚖ EMPATE</span></div>
        <div class="fc-r2"><span class="fc-prob">${p2}%</span></div>
      </div>`;
  }
  const t1wins = s1 > s2;
  return `
    <div class="fc-result">
      <div class="fc-r1">
        ${t1wins ? `<span class="result-win"><span class="chk">✓</span> GANA</span>` : `<span class="result-lose">PIERDE</span>`}
        <div><span class="fc-prob${!t1wins?'-l':''}">${p}%</span></div>
      </div>
      <div class="fc-r-mid"></div>
      <div class="fc-r2">
        ${!t1wins ? `<span class="result-win"><span class="chk">✓</span> GANA</span>` : `<span class="result-lose">PIERDE</span>`}
        <div><span class="fc-prob${t1wins?'-l':''}">${p2}%</span></div>
      </div>
    </div>`;
}

function fixtureCard(m, i=0) {
  const [t1,s1,t2,s2,p,grp,date,time,venue] = m;
  const isDraw = s1 === s2;
  const t1w = s1 > s2, t2w = s2 > s1;
  return `
    <div class="fc" style="animation-delay:${i*.03}s">
      <div class="fc-top">
        <span class="fc-grp">GRP ${grp}</span>
        <span class="fc-time">${time}</span>
        <span class="fc-venue">📍 ${venue}</span>
      </div>
      <div class="fc-body">
        <div class="fc-row">
          <div class="fc-t1 ${isDraw?'':t1w?'':'loser'}">
            <span class="fc-fl">${fl(t1)}</span>
            <span class="fc-ab">${ab(t1)}</span>
            <span class="fc-nm2">${t1}</span>
          </div>
          <div class="fc-sc-box">
            <div class="fc-sc">${s1}–${s2}</div>
            <span class="fc-sc-lbl">PREDICCIÓN</span>
          </div>

      const p2  = 100 - m.p;
      html += `
        <div class="kc" style="animation-delay:${i*.04}s">
          <div class="kc-top">
            <span class="kc-time">${m.time}</span>
            <span class="kc-conf ${m.conf}">● ${m.conf.toUpperCase()}</span>
          </div>
          <div class="kc-bg">
            <div class="kc-row">
              <div class="kc-team ${wc1}">

                <span class="kc-ab">${ab(m.t1)}</span>
                <span class="kc-nm">${m.t1}</span>

let _prevScore    = null;
let _prevMatchKey = null;
let _pollTimer    = null;
let _lastGoalId   = null;

function dismissGoal() {
  const o = document.getElementById('goal-overlay');
  if (!o || !o.classList.contains('active')) return;
  o.classList.add('out');
  setTimeout(() => { o.classList.remove('active','out'); }, 520);
}

function triggerGoal(team) {
  const o = document.getElementById('goal-overlay');
  if (!o) return;
  const c = FC[team];
  const flagImg = c ? `<img src="https://flagcdn.com/h80/${c}.png" class="goal-fi" alt="${team}">` : '';
  const initial = (team||'').charAt(0);
  const rest    = (team||'').slice(1);
  o.innerHTML = `<div class="goal-inner">
    <span class="goal-ball">⚽</span>
    <span class="goal-word">GOOOOAL!</span>
    <div class="goal-name-wrap">
      <span class="goal-init">${initial}</span><span class="goal-rest">${rest}</span>
    </div>
    ${flagImg}
    <span class="goal-hint">toca para cerrar</span>
  </div>`;
  o.onclick = dismissGoal;
  o.classList.remove('out');
  o.classList.add('active');
  clearTimeout(o._t);
  o._t = setTimeout(dismissGoal, 5500);
}

function checkGoal(data) {
  const lm = data.live_match;
  if (!lm || !lm.actual_score) { _prevScore = null; _prevMatchKey = null; return; }
  const key = lm.team1 + '|' + lm.team2;
  if (key !== _prevMatchKey) { _prevMatchKey = key; _prevScore = lm.actual_score; return; }
  const [g1,g2] = lm.actual_score.split('-').map(Number);
  const [p1,p2] = (_prevScore||'0-0').split('-').map(Number);
  if      (g1 > p1) triggerGoal(lm.team1);
  else if (g2 > p2) triggerGoal(lm.team2);
  _prevScore = lm.actual_score;
}

function badgeHtml(acc) {
  const map = {
    exact:   ['badge-exact',   '✅ EXACTO'],
    partial: ['badge-partial', '⚡ PARCIAL'],
    wrong:   ['badge-wrong',   '❌ ERRADO'],
    pending: ['badge-pending', '🔮 PENDIENTE'],
  };
  const [cls, label] = map[acc] || map.pending;
  return `<span class="badge ${cls}">${label}</span>`;
}

      <div class="mr-foot">
        <span class="mr-result-txt">${resultText}</span>
        <span style="font-size:9px;color:var(--trt);font-family:monospace">${m.team1} ${m.pred_score} ${m.team2}</span>
      </div>
    </div>`;
}

function upcomingCard(t1, s1, t2, s2, prob, grp, date, time, i, isNext) {
  const pred = `${s1}–${s2}`;
  const winner = s1>s2?t1:s2>s1?t2:null;
  const p2 = 100 - prob;
  const winnerStr = winner ? `${fl(winner)} ${ab(winner)} gana · ${s1>s2?prob:p2}%` : `Empate predicho`;
  return `
    <div class="uc" style="animation-delay:${i*.03}s">
      <div class="uc-top">
        ${isNext ? `<span style="font-size:9px;font-weight:700;color:var(--cel);font-family:monospace;letter-spacing:1px">🗓 PRÓXIMO</span>` : badgeHtml('pending')}
        <span class="uc-meta">Grp ${grp} · ${date} · ${time}</span>
      </div>
      <div class="uc-body">
        <div class="uc-team">
          <span class="uc-fl">${fl(t1)}</span>
          <span class="uc-ab">${ab(t1)}</span>
          <div class="uc-prob">${prob}%</div>
        </div>
        <div class="uc-ctr">
          <span class="uc-sc">${pred}</span>
          <span class="uc-lbl">PREDICCIÓN</span>
        </div>
        <div class="uc-team">
          <span class="uc-fl">${fl(t2)}</span>
          <span class="uc-ab">${ab(t2)}</span>
          <div class="uc-prob">${p2}%</div>
        </div>
      </div>
    </div>`;
}

function renderPredichos(data) {
  const acc = data.accuracy || {total_played:0,exact:0,partial:0,wrong:0,pct_exact:0,pct_winner_correct:0};
  const finished = data.matches_finished || [];
  const nm = data.next_match || {};

  // Build set of finished pairs (both orders)
  const finSet = new Set();
  finished.forEach(m => { finSet.add(m.team1+'|'+m.team2); finSet.add(m.team2+'|'+m.team1); });
  const nextKey1 = nm.team1&&nm.team2 ? nm.team1+'|'+nm.team2 : null;
  const nextKey2 = nm.team1&&nm.team2 ? nm.team2+'|'+nm.team1 : null;

  // All fixture matches flat
  const allFix = [...J1,...J2,...J3];

  // Upcoming = not finished and not the current next match
  const upcoming = allFix.filter(([t1,,t2]) => {
    const k1=t1+'|'+t2, k2=t2+'|'+t1;
    return !finSet.has(k1) && !finSet.has(k2) && k1!==nextKey1 && k1!==nextKey2;
  });

  let html = '';

  // ── Accuracy summary ──
  if (acc.total_played > 0) {
    html += `<div class="acc-card">
      <div class="acc-title">📊 ACCURACY GENERAL</div>
      <div style="font-size:12px;color:var(--sec);margin-bottom:10px">${acc.total_played} partido${acc.total_played!==1?'s':''} jugado${acc.total_played!==1?'s':''}</div>
      <div class="acc-grid">
        <div class="acc-item"><div class="acc-num" style="color:#059669">${acc.exact}</div><div class="acc-lbl">✅ EXACTAS · ${acc.pct_exact}%</div></div>
        <div class="acc-item"><div class="acc-num" style="color:#D97706">${acc.partial}</div><div class="acc-lbl">⚡ PARCIALES · ${acc.partial>0?Math.round(acc.partial/acc.total_played*100):0}%</div></div>
        <div class="acc-item"><div class="acc-num" style="color:#DC2626">${acc.wrong}</div><div class="acc-lbl">❌ ERRADAS · ${acc.wrong>0?Math.round(acc.wrong/acc.total_played*100):0}%</div></div>
        <div class="acc-item"><div class="acc-num">${acc.pct_winner_correct}%</div><div class="acc-lbl">🏆 GANADOR CORRECTO</div></div>
      </div>
    </div>`;
  }

  // ── Finished matches ──
  if (finished.length > 0) {
    html += `<div class="stitle">PARTIDOS JUGADOS</div>`;
    finished.forEach((m, i) => { html += matchResultCard(m, i); });
  }

  // ── Next match ──
  if (nm.team1 && nm.team2) {
    const [t1,s1str,t2,s2str] = [nm.team1, nm.pred_score?.split('-')[0]||'?', nm.team2, nm.pred_score?.split('-')[1]||'?'];
    const [s1,s2] = [parseInt(s1str)||0, parseInt(s2str)||0];
    html += `<div class="stitle">PRÓXIMO PARTIDO</div>`;
    html += upcomingCard(t1,s1,t2,s2,nm.p1||50,nm.group||'?',nm.date||'',nm.time||'',0,true);
  }

  // ── Upcoming ──
  const INITIAL_SHOW = 8;
  if (upcoming.length > 0) {
    html += `<div class="stitle">PRÓXIMOS PARTIDOS</div>`;
    const shown = upcoming.slice(0, INITIAL_SHOW);
    const rest  = upcoming.slice(INITIAL_SHOW);
    shown.forEach((m, i) => {
      const [t1,s1,t2,s2,prob,grp,date,time] = m;
      html += upcomingCard(t1,s1,t2,s2,prob,grp,date,time,i+1,false);
    });
    if (rest.length > 0) {
      html += `<div id="upcoming-rest" style="display:none">`;
      rest.forEach((m, i) => {
        const [t1,s1,t2,s2,prob,grp,date,time] = m;
        html += upcomingCard(t1,s1,t2,s2,prob,grp,date,time,INITIAL_SHOW+i+1,false);
      });
      html += `</div>`;
      html += `<button class="show-more-btn" onclick="document.getElementById('upcoming-rest').style.display='block';this.style.display='none'">Ver ${rest.length} partidos más ▾</button>`;
    }
  }

  if (!acc.total_played && !finished.length && !upcoming.length) {
    html = `<div style="text-align:center;padding:40px 20px;color:var(--trt);font-family:monospace">Cargando predicciones...</div>`;
  }

  document.getElementById('predichos-content').innerHTML = html;
}

async function init(){
  let data = FALLBACK;
  try{
    const res=await fetch(DATA_URL+"?t="+Date.now());
    if(res.ok) data=await res.json();
  } catch(e){
    document.getElementById("status-pill").style.background="rgba(215,119,6,.2)";
  }
  checkGoal(data);
  // Check manual goal event from GitHub Action
  try {
    const gr = await fetch(GOAL_URL + "?t=" + Date.now());
    if (gr.ok) {
      const gd = await gr.json();
      if (gd.id && gd.id !== '0' && gd.id !== _lastGoalId) {
        if (_lastGoalId !== null) triggerGoal(gd.team);
        _lastGoalId = gd.id;
      }
    }
  } catch(e) {}
  renderResumen(data);
  renderPredichos(data);
  document.getElementById("loading").style.display="none";
  if(!document.getElementById("partidos-content").innerHTML) renderRound("j1");
  // Smart polling: 30s while live, 5min otherwise
  clearInterval(_pollTimer);
  _pollTimer = setInterval(init, data.live_match ? 30000 : 5*60*1000);
}
