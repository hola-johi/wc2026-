<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Predicho — Intro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
    }

    /* ── Escena principal ── */
    .scene {
      position: relative;
      width: min(420px, 100vw);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Letras "2 6" ── */
    .letras {
      position: absolute;
      width: 85%;
      max-width: 340px;
      opacity: 0;
      transform: scale(0.88);
      animation: letrasIn 0.7s cubic-bezier(0.22,1,0.36,1) 0.3s forwards;
      z-index: 1;
      pointer-events: none;
    }
    .letras img { width: 100%; display: block; }

    @keyframes letrasIn {
      to { opacity: 1; transform: scale(1); }
    }

    /* ── Copa ── */
    .copa {
      position: absolute;
      width: 45%;
      max-width: 170px;
      z-index: 2;
      opacity: 0;
      /* empieza muy grande y centrada (efecto "viene de adelante") */
      transform: scale(5) translateY(0px);
      animation: copaZoom 1.1s cubic-bezier(0.16,1,0.3,1) 1.1s forwards;
      pointer-events: none;
    }
    .copa img { width: 100%; display: block; }

    @keyframes copaZoom {
      0%   { opacity: 0; transform: scale(5)   translateY(4px); }
      15%  { opacity: 1; }
      100% { opacity: 1; transform: scale(1)   translateY(0px); }
    }

    /* ── Acercamiento final de toda la escena ── */
    .scene.zoom-in {
      animation: sceneZoom 0.9s cubic-bezier(0.4,0,0.2,1) forwards;
    }
    @keyframes sceneZoom {
      0%   { transform: scale(1);    opacity: 1; }
      70%  { transform: scale(1.18); opacity: 1; }
      100% { transform: scale(1.4);  opacity: 0; }
    }

    /* ── Overlay fade-to-black ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      z-index: 99;
      animation: overlayIn 0.5s ease 3.5s forwards;
    }
    @keyframes overlayIn {
      to { opacity: 1; }
    }

    /* ── Botón replay (para testear) ── */
    .replay {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,.3);
      padding: 10px 28px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      z-index: 200;
      font-family: monospace;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<div class="overlay"></div>

<div class="scene" id="scene">
  <div class="letras">
    <img src="assets/anim/letras.png" alt="2026"/>
  </div>
  <div class="copa">
    <img src="assets/anim/copa.png" alt="Copa"/>
  </div>
</div>

<button class="replay" onclick="replay()">↺ REPLAY</button>

<script>
  const scene = document.getElementById('scene');

  // Acercamiento final: se dispara cuando la copa ya llegó a su lugar
  setTimeout(() => {
    scene.classList.add('zoom-in');
  }, 2500);

  function replay() {
    location.reload();
  }
</script>
</body>
</html>
