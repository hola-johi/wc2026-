<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Predicho — Intro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
    }

    /* ── Escena: ocupa toda la pantalla, todo centrado ── */
    .scene {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
    }

    /* ── Contenedor fijo para que nada se mueva ── */
    .stage {
      position: relative;
      width:  min(75vw, 75vh * 0.648, 300px);
      height: min(75vw / 0.648, 75vh, 463px);
      transform: translateZ(0);
      will-change: transform;
    }

    /* ── Letras "2 6" — fondo del stage ── */
    .letras {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.9);
      animation: letrasIn 0.7s cubic-bezier(0.22,1,0.36,1) 0.3s forwards;
      z-index: 1;
    }
    .letras img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    @keyframes letrasIn {
      to { opacity: 1; transform: scale(1); }
    }

    /* ── Copa — centrada en el stage, alineada al hueco entre 2 y 6 ── */
    .copa {
      position: absolute;
      /* centrada horizontal, desplazada un poco arriba del centro del stage
         para quedar en el hueco entre las letras (ajustar top si hace falta) */
      left: 50%;
      top:  44%;
      transform: translate(-50%, -50%) scale(6);
      width: 62%;
      z-index: 2;
      opacity: 0;
      animation: copaZoom 1.1s cubic-bezier(0.16,1,0.3,1) 1.1s forwards;
    }
    .copa img { width: 100%; display: block; }

    @keyframes copaZoom {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(6); }
      12%  { opacity: 1; }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    /* ── Zoom-in final de toda la escena ── */
    .scene {
      will-change: transform, opacity;
    }
    .scene.zoom-in {
      animation: sceneZoom 1.1s cubic-bezier(0.25,0.1,0.25,1) forwards;
    }
    @keyframes sceneZoom {
      0%   { transform: scale(1);    opacity: 1; }
      100% { transform: scale(1.5);  opacity: 0; }
    }

    /* ── Fade-to-black ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      z-index: 99;
      animation: overlayIn 0.4s ease 3.5s forwards;
    }
    @keyframes overlayIn { to { opacity: 1; } }

    /* ── Replay (test) ── */
    .replay {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,.25);
      padding: 10px 28px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      z-index: 200;
      font-family: monospace;
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>

<div class="overlay"></div>

<div class="scene" id="scene">
  <div class="stage">
    <div class="letras">
      <img src="assets/anim/letras.png" alt="2026"/>
    </div>
    <div class="copa">
      <img src="assets/anim/copa.png" alt="Copa"/>
    </div>
  </div>
</div>

<button class="replay" onclick="location.reload()">↺ REPLAY</button>

<script>
  setTimeout(() => {
    document.getElementById('scene').classList.add('zoom-in');
  }, 2600);
</script>
</body>
</html>
