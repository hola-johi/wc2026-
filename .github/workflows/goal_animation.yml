name: Goal animation

on:
  workflow_dispatch:
    inputs:
      team:
        description: "Pais que metio el gol"
        required: true
        type: choice
        options:
          - Argentina
          - Algeria
          - Australia
          - Austria
          - Belgium
          - Bolivia
          - Bosnia
          - Brazil
          - Canada
          - Cape Verde
          - Chile
          - Colombia
          - Costa Rica
          - Croatia
          - Curacao
          - Czechia
          - DR Congo
          - Denmark
          - Ecuador
          - Egypt
          - England
          - France
          - Germany
          - Ghana
          - Guatemala
          - Haiti
          - Honduras
          - Iceland
          - Indonesia
          - Iran
          - Iraq
          - Italy
          - Ivory Coast
          - Jamaica
          - Japan
          - Jordan
          - Mexico
          - Morocco
          - Netherlands
          - New Zealand
          - Nigeria
          - Norway
          - Panama
          - Paraguay
          - Peru
          - Poland
          - Portugal
          - Qatar
          - Saudi Arabia
          - Scotland
          - Senegal
          - South Africa
          - South Korea
          - Spain
          - Sweden
          - Switzerland
          - Tunisia
          - Turkey
          - United States
          - Uruguay
          - Uzbekistan
          - Venezuela

jobs:
  trigger-goal:
    name: Publish goal event
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write goal_event.json
        run: |
          set -euo pipefail

          TEAM="${{ github.event.inputs.team }}"
          TS="$(date -u +%s)"
          ISO="$(date -u --iso-8601=seconds)"

          mkdir -p output
          printf '{\n  "team": "%s",\n  "timestamp": "%s",\n  "id": "%s"\n}\n' \
            "$TEAM" "$ISO" "$TS" > output/goal_event.json

          echo "Generated output/goal_event.json:"
          cat output/goal_event.json

      - name: Commit and push
        run: |
          set -euo pipefail

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "WC2026 Bot"

          git add output/goal_event.json
          TEAM="${{ github.event.inputs.team }}"
          git commit -m "GOAL! ${TEAM} - $(date -u '+%H:%M UTC')"
          git push

          echo "Goal event published for ${TEAM}"
